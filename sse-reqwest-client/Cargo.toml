[package]
name = "sse-reqwest-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.86.0"
description = "A robust, auto-reconnecting Server-Sent Events (SSE) client built on reqwest"
readme = "./README.md"
repository = "https://github.com/PizzasBear/sse-rs"
license = "MIT OR Apache-2.0"

keywords = ["eventsource", "http", "reqwest", "sse", "stream"]
categories = [
  "api-bindings",
  "network-programming",
  "web-programming::http-client"
]

[dependencies]
bytes = { version = "1.11" }
futures-core = { version = "0.3" }
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
serde = { version = "1.0", features = ["derive"], optional = true }
sse-core = { path = "../sse-core", version = "0.1" }
thiserror = { version = "2.0" }
tokio = { version = "1.52" }

[dev-dependencies]
futures-util = "0.3.32"
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread"] }
tokio-test = "0.4.5"

[features]
serde = ["dep:serde", "sse-core/serde"]
